<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Винный кроссворд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f2f3f0; --surface:#ffffff; --ink:#1d1f1c; --muted:#5f655d; --line:#d9dcd5;
  --wine:#7a1f3d; --wine-soft:#f3e6ea; --ok:#2f6b3a; --ok-soft:#e3f0e4; --bad:#a1262f; --bad-soft:#f7e3e4;
  --sel:#f6dfa8; --selw:#fbf0d3;
  --display:"Prata",Georgia,serif; --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141613; --surface:#1d201c; --ink:#ebece8; --muted:#a3a99f; --line:#33372f;
  --wine:#e08aa6; --wine-soft:#3a2129; --ok:#7fc58b; --ok-soft:#1f3322; --bad:#f08a8f; --bad-soft:#3d1f22;
  --sel:#6b5420; --selw:#3a3220; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:700px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-left)) 260px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
h1{font-size:clamp(26px,7vw,36px);line-height:1.15}
p{margin:0}
a{color:var(--wine)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--wine);font-weight:600}
.lead{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:4px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
button,.btn{font:inherit;font-weight:600;border-radius:999px;padding:10px 18px;border:1px solid var(--wine);background:var(--wine);color:var(--surface);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.ghost{background:transparent;color:var(--wine)}
button.small{padding:7px 13px;font-size:14px}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.themes button{background:var(--surface);color:var(--ink);border-color:var(--line);font-weight:500;padding:8px 14px;font-size:15px}
.themes button[aria-pressed=true]{background:var(--wine);color:var(--surface);border-color:var(--wine)}
.stat{font-size:14px;color:var(--muted)}
/* grid */
#gridbox{display:flex;justify-content:center;margin-block:6px}
#grid{display:grid;gap:2px;touch-action:manipulation;user-select:none}
.c{position:relative;background:var(--surface);border:1px solid var(--ink);border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:600;text-transform:uppercase;cursor:pointer}
.c.x{background:transparent;border-color:transparent;cursor:default}
.c .n{position:absolute;top:0;left:2px;font-size:9px;line-height:1.1;font-weight:500;color:var(--muted)}
.c.w{background:var(--selw)}
.c.cur{background:var(--sel)}
.c.bad{color:var(--bad);background:var(--bad-soft)}
.c.hint{color:var(--wine)}
.c.done{background:var(--ok-soft)}
/* clues */
.clues h3{font-size:18px;margin-bottom:6px}
.clues ol{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:4px}
.clues li{padding:6px 8px;border-radius:8px;cursor:pointer;font-size:15px}
.clues li b{color:var(--wine);margin-right:6px}
.clues li.on{background:var(--selw)}
.clues li.ok{color:var(--muted);text-decoration:line-through}
.len{color:var(--muted);font-size:13px;margin-left:4px}
/* bottom panel */
#panel{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}
#panel .in{max-width:700px;margin:0 auto}
#clue{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;min-height:58px}
#clue button{padding:0;width:36px;height:36px;justify-content:center;background:transparent;color:var(--wine);border-color:var(--line)}
#cluetxt{font-size:15px;line-height:1.35}
#cluetxt b{color:var(--wine)}
.kb{display:flex;flex-direction:column;gap:6px}
.kr{display:flex;gap:4px;justify-content:center}
.kr button{flex:1 1 0;max-width:46px;min-width:0;height:44px;padding:0;justify-content:center;border-radius:7px;background:var(--surface);color:var(--ink);border-color:var(--line);font-weight:500;font-size:17px}
.kr button:active{background:var(--wine-soft)}
.kr button.wide{max-width:66px;flex-grow:1.5;color:var(--wine)}
.tools{display:flex;gap:6px;justify-content:center;margin-top:8px}
.tools button{padding:7px 12px;font-size:14px;white-space:nowrap}
#win{border-color:var(--ok);background:var(--ok-soft)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../">← К обучению</a><span class="stat" id="timer">0:00</span></div>

  <section id="start" class="stack">
    <p class="eyebrow">Винотеки · игра</p>
    <h1>Винный кроссворд</h1>
    <p class="lead">Слова — из модулей обучения: сорта, регионы, термины, крепкое. Сетка каждый раз новая. Выбери тему и начни.</p>
    <div class="themes" id="themes"></div>
    <div class="row"><button id="go">Новый кроссворд</button></div>
    <p class="stat" id="stats"></p>
  </section>

  <section id="game" class="stack" hidden>
    <div class="row" style="justify-content:space-between">
      <span class="eyebrow" id="gtheme"></span>
      <button class="ghost small" id="newg">Другая тема</button>
    </div>
    <div id="win" class="card stack" hidden></div>
    <div id="gridbox"><div id="grid"></div></div>
    <div class="clues" id="clues"></div>
  </section>
</div>

<div id="panel" hidden><div class="in">
  <div id="clue"><button type="button" id="prev" aria-label="Предыдущее слово">‹</button><p id="cluetxt"></p><button type="button" id="next" aria-label="Следующее слово">›</button></div>
  <div class="kb" id="kb"></div>
  <div class="tools">
    <button class="ghost small" id="check">Проверить</button>
    <button class="ghost small" id="hint">Подсказать букву</button>
    <button class="ghost small" id="reveal">Ответы</button>
  </div>
</div></div>

    const dr=d?1:0, dc=d?0:1; let cross=0;
    if(at(r-dr,c-dc)||at(r+dr*w.length,c+dc*w.length)) return -1;
    let r0=Math.min(minR,r), r1=Math.max(maxR,r+dr*(w.length-1)), c0=Math.min(minC,c), c1=Math.max(maxC,c+dc*(w.length-1));
    if(r1-r0+1>MAXH||c1-c0+1>MAXW) return -1;
    for(let i=0;i<w.length;i++){
      const rr=r+dr*i, cc=c+dc*i, x=at(rr,cc);
      if(x){ if(x.ch!==w[i]||x[d?"v":"h"]) return -1; cross++; }
      else if(at(rr+dc,cc+dr)||at(rr-dc,cc-dr)) return -1;
    }
    return cross;
  }
  function put(it,r,c,d){
    const dr=d?1:0, dc=d?0:1, w=it.w;
    for(let i=0;i<w.length;i++){ const rr=r+dr*i, cc=c+dc*i, k=key(rr,cc); const x=g.get(k)||{ch:w[i]}; x[d?"v":"h"]=true; g.set(k,x); }
    minR=Math.min(minR,r); maxR=Math.max(maxR,r+dr*(w.length-1)); minC=Math.min(minC,c); maxC=Math.max(maxC,c+dc*(w.length-1));
    words.push({w:it.w,q:it.c,r,c,d});
  }
  const list=shuf(pool), first=list.findIndex(x=>x.w.length>=6&&x.w.length<=MAXW);
  const f=list.splice(first<0?0:first,1)[0]; if(f.w.length>MAXW) return null;
  put(f,0,0,0);
  let crosses=0;
  for(let pass=0;pass<2&&words.length<target;pass++){
    for(const it of list){
      if(words.length>=target) break;
      if(words.some(x=>x.w===it.w)||it.w.length>MAXW) continue;
      let best=null;
      for(const wd of words){ for(let i=0;i<wd.w.length;i++){ const ch=wd.w[i];
        const rr=wd.r+(wd.d?i:0), cc=wd.c+(wd.d?0:i);
        for(let j=0;j<it.w.length;j++){ if(it.w[j]!==ch) continue;
          const d=1-wd.d, r=d?rr-j:rr, c=d?cc:cc-j, n=fits(it.w,r,c,d);
          if(n>0&&(!best||n>best.n||(n===best.n&&Math.random()<.4))) best={r,c,d,n};
        } } }
      if(best){ put(it,best.r,best.c,best.d); crosses+=best.n; }
    }
  }
  const area=(maxR-minR+1)*(maxC-minC+1);
  words.forEach(w=>{ w.r-=minR; w.c-=minC; });
  return {words,h:maxR-minR+1,w:maxC-minC+1,score:words.length*20+crosses*4-area/6};
}
function generate(pool){
  const target=Math.min(12,pool.length); let best=null;
  for(let i=0;i<120;i++){ const b=build(pool,target); if(b&&(!best||b.score>best.score)) best=b; }
  // numbering
  const starts=[...best.words].sort((a,b)=>a.r-b.r||a.c-b.c); let n=0, last="";
  starts.forEach(w=>{ const k=w.r+","+w.c; if(k!==last){ n++; last=k; } w.n=n; });
  best.words.sort((a,b)=>a.d-b.d||a.n-b.n);
  return best;
}

/* ---------- game state ---------- */
let P=null, cells=null, cur=null, wi=0, t0=0, tick=null, hints=0, finished=false;
function cellsOf(w){ const a=[]; for(let i=0;i<w.w.length;i++) a.push(w.d?[w.r+i,w.c]:[w.r,w.c+i]); return a; }
function startGame(){
  const th=THEMES.find(x=>x.k===st.theme);
  const pool=BANK.filter(x=>!th.m||th.m.includes(x.t));
  P=generate(pool); hints=0; finished=false;
  cells=[]; for(let r=0;r<P.h;r++){ cells.push([]); for(let c=0;c<P.w;c++) cells[r].push(null); }
  P.words.forEach((w,i)=>cellsOf(w).forEach(([r,c],j)=>{ const x=cells[r][c]||(cells[r][c]={a:w.w[j],v:"",ws:[],bad:false,hint:false}); x.ws.push(i); }));
  P.words.forEach(w=>{ cells[w.r][w.c].n=w.n; });
  $("gtheme").textContent=th.t; $("win").hidden=true;
  $("start").hidden=true; $("game").hidden=false; $("panel").hidden=false;
  renderGrid(); renderClues(); select(0,0);
  t0=Date.now(); clearInterval(tick); tick=setInterval(()=>{ if(!finished) $("timer").textContent=fmt(secs()); },1000);
  window.scrollTo(0,0);
}
const secs=()=>Math.round((Date.now()-t0)/1000);
function renderGrid(){
  const avail=Math.min(document.querySelector(".wrap").clientWidth-4, 640);
  const ph=$("panel").offsetHeight||300, byH=Math.floor((window.innerHeight-ph-110)/P.h-2);
  const sz=Math.max(24,Math.min(40,byH,Math.floor((avail-(P.w-1)*2)/P.w)));
  const g=$("grid"); g.style.gridTemplateColumns=`repeat(${P.w},${sz}px)`; g.style.gridAutoRows=sz+"px"; g.style.fontSize=Math.round(sz*.55)+"px";
  let h="";
  for(let r=0;r<P.h;r++) for(let c=0;c<P.w;c++){ const x=cells[r][c];
    h+= x?`<div class="c" data-r="${r}" data-c="${c}">${x.n?`<span class="n">${x.n}</span>`:""}<span class="l"></span></div>`:`<div class="c x"></div>`; }
  g.innerHTML=h; paint();
}
function renderClues(){
  const part=(d,t)=>`<h3>${t}</h3><ol>`+P.words.map((w,i)=>w.d!==d?"":`<li data-i="${i}" id="cl${i}"><b>${w.n}</b>${esc(w.q)}<span class="len">(${w.w.length})</span></li>`).join("")+`</ol>`;
  $("clues").innerHTML=part(0,"По горизонтали")+part(1,"По вертикали");
}
function wordDone(i){ return cellsOf(P.words[i]).every(([r,c])=>cells[r][c].v===cells[r][c].a); }
function paint(){
  const w=P.words[wi], inW=new Set(cellsOf(w).map(a=>a.join(",")));
  document.querySelectorAll("#grid .c[data-r]").forEach(el=>{
    const r=+el.dataset.r, c=+el.dataset.c, x=cells[r][c];
    el.querySelector(".l").textContent=x.v;
    el.classList.toggle("w",inW.has(r+","+c)); el.classList.toggle("cur",cur&&cur[0]===r&&cur[1]===c);
    el.classList.toggle("bad",x.bad); el.classList.toggle("hint",x.hint);
    el.classList.toggle("done",finished&&x.v===x.a);
  });
  document.querySelectorAll("#clues li").forEach(li=>{ const i=+li.dataset.i; li.classList.toggle("on",i===wi); li.classList.toggle("ok",wordDone(i)&&!cellsOf(P.words[i]).some(([r,c])=>cells[r][c].bad&&finished)); });
  $("cluetxt").innerHTML=`<b>${w.n} ${w.d?"↓":"→"}</b> ${esc(w.q)} <span class="len">(${w.w.length})</span>`;
}
function select(i,pos){ wi=i; const cs=cellsOf(P.words[i]);
  if(pos===undefined){ const e=cs.findIndex(([r,c])=>!cells[r][c].v); pos=e<0?0:e; }
  cur=cs[pos]; paint(); }
function posIn(){ return cellsOf(P.words[wi]).findIndex(([r,c])=>r===cur[0]&&c===cur[1]); }
function type(ch){
  if(finished||!cur) return; const x=cells[cur[0]][cur[1]];
  if(!x.hint){ x.v=ch; x.bad=false; }
  const cs=cellsOf(P.words[wi]); let p=posIn();
  if(p<cs.length-1) cur=cs[p+1];
  else if(wordDone(wi)) { const n=nextOpen(1); if(n!==null){ select(n); afterType(); return; } }
  afterType();
}
function afterType(){ paint(); checkWin(); }
function back(){
  if(finished||!cur) return; const cs=cellsOf(P.words[wi]); let p=posIn(), x=cells[cur[0]][cur[1]];
  if((x.v===""||x.hint)&&p>0){ cur=cs[p-1]; x=cells[cur[0]][cur[1]]; }
  if(!x.hint){ x.v=""; x.bad=false; } paint();
}
function nextOpen(step){ const n=P.words.length; for(let k=1;k<=n;k++){ const i=(wi+step*k+n*k)%n; if(!wordDone(i)) return i; } return null; }
function checkWin(){
  for(const row of cells) for(const x of row) if(x&&x.v!==x.a) return;
  finish(true);
}
function finish(solved){
  finished=true; clearInterval(tick); const s=secs();
  let msg;
  if(solved){
    st.solved=(st.solved||0)+1;
    const rec=st.best[st.theme]; let isRec=false;
    if(hints===0&&(rec===undefined||s<rec)){ st.best[st.theme]=s; isRec=rec!==undefined; }
    save();
    msg=`<h3>Разгадано!</h3><p>Время: <b>${fmt(s)}</b>${hints?`, открыто букв: ${hints}`:", без подсказок"}.${isRec?" Новый рекорд по этой теме!":""}</p>`+
      (hints?`<p class="stat">Рекорд считается только без подсказок.</p>`:"");
  } else msg=`<h3>Ответы открыты</h3><p>Посмотри слова, которые не получились, и найди их в модулях. Следующий кроссворд будет другим.</p>`;
  $("win").innerHTML=msg+`<div class="row"><button id="again">Ещё кроссворд</button><button class="ghost" id="other">Другая тема</button></div>`;
  $("win").hidden=false; $("panel").hidden=true; paint(); window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- start screen ---------- */
function startScreen(){
  clearInterval(tick); $("timer").textContent="";
  $("themes").innerHTML=THEMES.map(t=>`<button type="button" data-k="${t.k}" aria-pressed="${t.k===st.theme}">${t.t}</button>`).join("");
  const rec=st.best[st.theme];
  $("stats").textContent=`Разгадано кроссвордов: ${st.solved||0}`+(rec!==undefined?` · рекорд в этой теме без подсказок: ${fmt(rec)}`:"");
  $("start").hidden=false; $("game").hidden=true; $("panel").hidden=true;
}

/* ---------- keyboard ---------- */
const ROWS=["ЙЦУКЕНГШЩЗХЪ","ФЫВАПРОЛДЖЭ","ЯЧСМИТЬБЮ"];
$("kb").innerHTML=ROWS.map((r,i)=>`<div class="kr">`+[...r].map(ch=>`<button type="button" data-k="${ch}">${ch}</button>`).join("")+(i===2?`<button type="button" class="wide" data-k="BS" aria-label="Стереть">⌫</button>`:"")+`</div>`).join("");
$("kb").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; b.dataset.k==="BS"?back():type(b.dataset.k); });
document.addEventListener("keydown",e=>{
  if(!P||$("panel").hidden) return;
  if(e.key==="Backspace"){ e.preventDefault(); back(); return; }
  if(e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="Tab"){ e.preventDefault(); const n=nextOpen(1); if(n!==null) select(n); return; }
  if(e.key==="ArrowLeft"||e.key==="ArrowUp"){ e.preventDefault(); const n=nextOpen(-1); if(n!==null) select(n); return; }
  let k=e.key.toUpperCase(); if(k==="Ё") k="Е";
  if(/^[А-ЯЁ]$/.test(k)&&!e.ctrlKey&&!e.metaKey){ e.preventDefault(); type(k); }
});

/* ---------- clicks ---------- */
document.addEventListener("click",e=>{
  const th=e.target.closest("#themes button");
  if(th){ st.theme=th.dataset.k; save(); startScreen(); return; }
  const c=e.target.closest("#grid .c[data-r]");
  if(c&&!finished){ const r=+c.dataset.r, cc=+c.dataset.c, x=cells[r][cc];
    let i=x.ws[0];
    if(x.ws.length>1){ const same=cur&&cur[0]===r&&cur[1]===cc; i= x.ws.includes(wi)? (same?x.ws.find(k=>k!==wi):wi) : x.ws[0]; }
    wi=i; cur=[r,cc]; paint(); return; }
  const li=e.target.closest("#clues li");
  if(li&&!finished){ select(+li.dataset.i); $("panel").scrollIntoView&&0; return; }
  const id=e.target.closest("button")?.id;
  if(id==="go"||id==="again") startGame();
  else if(id==="newg"||id==="other") startScreen();
  else if(id==="prev"){ const n=nextOpen(-1); if(n!==null) select(n); }
  else if(id==="next"){ const n=nextOpen(1); if(n!==null) select(n); }
  else if(id==="check"){ let wrong=0; for(const row of cells) for(const x of row) if(x&&x.v&&x.v!==x.a){ x.bad=true; wrong++; }
    paint(); $("cluetxt").innerHTML= wrong?`<b>Ошибок: ${wrong}.</b> Они выделены красным.`:`<b>Ошибок нет.</b> Продолжай!`;
    setTimeout(()=>{ if(!finished) paint(); },2200); }
  else if(id==="hint"){ if(!cur||finished) return; const x=cells[cur[0]][cur[1]];
    if(x.v!==x.a){ x.v=x.a; x.hint=true; x.bad=false; hints++; } type(x.a); }
  else if(id==="reveal"){ if(finished) return; if(!confirm("Показать все ответы? Кроссворд не засчитается.")) return;
    for(const row of cells) for(const x of row) if(x&&x.v!==x.a){ x.v=x.a; x.bad=true; }
    finish(false); }
});
window.addEventListener("resize",()=>{ if(P&&!$("game").hidden) renderGrid(); });
startScreen();
</script>
</body>
</html>
